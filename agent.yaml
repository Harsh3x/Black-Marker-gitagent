    
spec_version: "0.1.0"
name: black-marker
description: Autonomous legal document redaction engine. Identifies and physically redacts PII and confidential information from PDFs.
version: 1.0.0
author: "Harsh"
license: MIT


model:
  preferred: "openai:gpt-4.1-mini"
  fallback:
    - "anthropic:claude-sonnet-4-5-20250929"
    - "openai:gpt-4o"

session:
  mode: continuous
  history: true


prompt: prompt.md
 
tools:
  - tools/redact
  - tools/redact_review
  - tools/finalize_redactions
  

skills:
  - skills/hunt-for-pii

hooks:
  pre_tool_use:
    - script: hooks/audit.sh
      description: Audit log every redaction invocation

memory:
  path: memory/
  persist: true
  
  
runtime:
  max_turns: 30
  timeout: 120
  
compliance:
  risk_level: high
  human_in_the_loop: true
  review:
    required: false
    tool: redact_pdf_review
  data_classification: confidential
  recordkeeping:
    audit_logging: true
    retention_days: 90
output:
  directory: ./output    
    
