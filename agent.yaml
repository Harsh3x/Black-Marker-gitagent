
spec_version: "0.1.0"
name: black-marker
version: 0.1.0
description: Autonomous legal document redaction engine. Identifies and physically redacts PII and confidential information from PDFs.
author: "Harsh"
license: MIT
model:
  preferred: "anthropic:claude-sonnet-4-5-20250929"
  fallback:
    - "openai:gpt-4o-mini"

session:
  mode: continuous
  history: true
  
runtime:
  max_turns: 30
  timeout: 120
  
soul: ./SOUL.md
rules: ./RULES.md

tools:
  - ./tools/extract_pdf_text.yaml
  - ./tools/apply_pdf_redaction.yaml

skills:
  - ./skills/hunt-for-pii
  - ./skills/map-redaction-coordinates

workflows:
  - ./workflows/redact_document.yaml

memory:
  path: ./memory
  persist: true

output:
  directory: ./output
  clean_originals: true
