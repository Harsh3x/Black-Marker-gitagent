
spec_version: "0.1.0"
name: black-marker
version: 0.1.0
description: Autonomous legal document redaction engine. Identifies and physically redacts PII and confidential information from PDFs.
author: "Harsh"
license: MIT
model:
  preferred: "openai:gpt-4o-mini"

session:
  mode: continuous
  history: true
  
runtime:
  max_turns: 30
  timeout: 120
  
soul: ./SOUL.md
rules: ./RULES.md

tools:
  - extract_pdf_text

skills:
  - ./hunt-for-pii

workflows:

memory:
  path: ./memory
  persist: true

output:
  directory: ./output
  clean_originals: true
