name: finalize-redactions
description: "Converts human-approved yellow highlights in a reviewed PDF into permanent black redaction boxes and scrubs metadata. Call when user says 'finalize', 'looks good', 'go ahead', or 'commit' after reviewing a highlighted PDF."
version: 1.0.0
input_schema:
  type: object
  properties:
    pdf_path:
      type: string
      description: Path to the _FOR_REVIEW.pdf to finalize
   compliance:
      type: string
      description: Compliance mode - hipaa, gdpr, dpdp, or full
      enum: [hipaa, gdpr, dpdp, full]
  required: [pdf_path, compliance]
implementation:
  script: finalize-redactions.sh
  runtime: bash
