
name: redact
description: Permanently redacts all PII and confidential data from a PDF by drawing solid black boxes. Call this immediately when the user gives a PDF path with no mention of reviewing first.
version: 1.0.0
input_schema:
  type: object
  properties:
    pdf_path:
      type: string
      description: Path to the PDF file to redact
    compliance:
      type: string
      description: Compliance mode - hipaa, gdpr, dpdp, or full
      enum: [hipaa, gdpr, dpdp, full]
  required: [pdf_path, compliance]
implementation:
  script: redact.sh
  runtime: bash
