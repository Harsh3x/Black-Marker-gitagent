name: redact_pdf
description: >
  Fully redact a PDF — draws permanent solid black boxes over all PII and
  confidential data. The original file is never placed in /output.
  Use this for final production redaction.

input:
  pdf_path:
    type: string
    description: Path to the PDF file to redact
    required: true

output:
  type: object
  schema:
    output_path:
      type: string
      description: Path to the redacted PDF
    total_redactions:
      type: integer
    pages_affected:
      type: array
    report_path:
      type: string

run: ../../tools/redact.sh
