name: finalize_redactions
description: >
  Finalizer for human-reviewed PDFs. Takes a _FOR_REVIEW.pdf that a human
  has inspected (yellow highlights), converts all approved annotations into
  permanent black redaction boxes, and scrubs metadata.
  Call this AFTER redact_pdf_review and human approval.

input:
  pdf_path:
    type: string
    description: Path to the human-reviewed _FOR_REVIEW.pdf
    required: true

output:
  type: object
  schema:
    output_path:
      type: string
      description: Path to the final permanently redacted PDF
    total_redactions:
      type: integer
    pages_affected:
      type: array

run: ../../tools/finalize_redactions.sh
