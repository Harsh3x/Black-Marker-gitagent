name: redact_pdf_review
description: >
  Human-in-the-loop review mode — highlights sensitive regions in yellow
  instead of blacking them out. Use this to let a human verify findings
  before committing to permanent redaction.

input:
  pdf_path:
    type: string
    description: Path to the PDF file to review
    required: true

output:
  type: object
  schema:
    output_path:
      type: string
      description: Path to the highlighted review PDF
    total_findings:
      type: integer
    report_path:
      type: string

run: ../../tools/redact_review.sh
